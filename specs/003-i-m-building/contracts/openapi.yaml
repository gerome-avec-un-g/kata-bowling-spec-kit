openapi: 3.0.0
info:
  title: Bowling Score Calculator API
  version: 1.0.0
  description: API for calculating the total score of a single line of American Ten-Pin Bowling.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
paths:
  /score:
    post:
      summary: Calculate Bowling Score
      description: Calculates the total score for a given sequence of bowling rolls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rolls
              properties:
                rolls:
                  type: string
                  description: A string representing the sequence of rolls for one line of American Ten-Pin Bowling (e.g., "X|7/|9-|X|-8|8/|-6|X|X|X||81").
                  example: "X|X|X|X|X|X|X|X|X|X|X|X"
      responses:
        '200':
          description: Successfully calculated score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                    description: The total calculated score for the bowling game.
                    example: 300
        '400':
          description: Invalid or incomplete roll sequence provided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Description of the error.
                    example: "Invalid roll sequence: '11' is not a valid roll."
